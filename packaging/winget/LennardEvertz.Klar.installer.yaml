# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.6.0.schema.json
#
# Einreichen: Datei nach manifests/l/LennardEvertz/Klar/1.0.1/ im Fork von
# microsoft/winget-pkgs legen, zusammen mit den beiden anderen Dateien aus
# diesem Ordner, dann PR. Vorher lokal pruefen:
#
#   winget validate --manifest packaging/winget
#   winget install --manifest packaging/winget
